<table>
    <tr>
        <th>Datum/Tijd</th>
        <th>Ploegnummer</th>
        <th>Sync</th>
    </tr>

    {% for doorkomst in doorkomsten %}
        <tr>
            <td>
                {{doorkomst["DATETIME"]}}
            </td>
            <td>
                {{doorkomst["PLOEG"]}}
            </td>
            <td>
                {{doorkomst["STATUS"]}}
            </td>
        </tr>
              
    {% endfor %}  
</table>
