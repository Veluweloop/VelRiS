{% extends "base.html" %}

{% block content %}

<div class="container">
    <div class="row">
    </div>

    <div class="row">

        <div class="col s8">

            <div class="row">
                <form method="POST" id="input_doorkomst">
                    <input
                        type="number"
                        class="form-control col s12 center-align"
                        placeholder="Ploegnummer"
                        id="team_insert"
                        name="team_insert"
                        autofocus
                    />
                </form>
            </div>

            <div class="container">

                <div class="row">
                    <button class="btn col s4 center-align" value="1" onclick="function_insertnumber(this.value)">1</button>
                    <button class="btn col s4 center-align" value="2" onclick="function_insertnumber(this.value)">2</button>
                    <button class="btn col s4 center-align" value="3" onclick="function_insertnumber(this.value)">3</button>
                </div>

                <div class="row">
                    <button class="btn col s4 center-align" value="4" onclick="function_insertnumber(this.value)">4</button>
                    <button class="btn col s4 center-align" value="5" onclick="function_insertnumber(this.value)">5</button>
                    <button class="btn col s4 center-align" value="6" onclick="function_insertnumber(this.value)">6</button>
                </div>

                <div class="row">
                    <button class="btn col s4 center-align" value="7" onclick="function_insertnumber(this.value)">7</button>
                    <button class="btn col s4 center-align" value="8" onclick="function_insertnumber(this.value)">8</button>
                    <button class="btn col s4 center-align" value="9" onclick="function_insertnumber(this.value)">9</button>
                </div>

                <div class="row">
                    <button
                        class="btn col s4 center-align"
                        type="button"
                        onclick="function_cancel()">
                        BACKSPACE
                    </button>

                    <button
                        class="btn col s4 center-align"
                        value="0"
                        onclick="function_insertnumber(this.value)">
                        0
                    </button>

                    <button
                        class="btn col s4 center-align"
                        type="submit"
                        form="input_doorkomst">
                        ENTER
                    </button>
                </div>

            </div>
        </div>

        <div class="col s4">
            <div class="col s12" id="doorkomsten-container"></div>
        </div>

    </div>
</div>


<script>

    function function_cancel() {
        document.getElementById("team_insert").value = "";
    }


    function function_insertnumber(number) {
        const input = document.getElementById("team_insert");
        input.value = input.value + number;
    }


    // Submit doorkomst without reloading the page
    document.getElementById("input_doorkomst").addEventListener("submit", async function(event) {

        event.preventDefault();

        const form = this;
        const input = document.getElementById("team_insert");
        const ploegnummer = input.value.trim();

        try {

            const response = await fetch(form.action || window.location.href, {
                method: "POST",
                body: new FormData(form)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            // Database write succeeded
            M.toast({
                html: "Ploeg " + ploegnummer + " opgeslagen"
            });

            // Clear input
            input.value = "";
            input.focus();

        } catch (error) {

            console.error("Error submitting doorkomst:", error);

            M.toast({
                html: "Opslaan mislukt"
            });
        }

    });


    // Reload doorkomsten
    async function reloadDoorkomsten() {

        try {

            const response = await fetch(
                "{{ url_for('doorkomsten_fragment') }}",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const html = await response.text();

            document.getElementById(
                "doorkomsten-container"
            ).innerHTML = html;

        } catch (error) {

            console.error(
                "Error loading doorkomsten:",
                error
            );
        }

        // Wait until this request has finished,
        // then wait another second before making
        // the next request.
        setTimeout(reloadDoorkomsten, 1000);
    }


    // Start the automatic refresh
    document.addEventListener("DOMContentLoaded", () => {
        reloadDoorkomsten();
    });

</script>

{% endblock %}
