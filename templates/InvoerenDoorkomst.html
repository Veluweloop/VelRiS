<!DOCTYPE html>
<html> 

    <head>
        <meta name = "viewport" content = "width = device-width, initial-scale = 1">     
        <link rel="stylesheet" media="screen" href="{{ url_for('static', filename='bootstrap.min.css') }}">
        
        <style>
        html{
            width: 100vw;
            height: 100vh;
            }
        body{
            width: 100vw;
            height: 100vh;
            }
        </style>

    </head>
    <body>
        <div class="container-fluid">
            {% include "navbar.html" %}
            <div class="row">
                                
                <div class="col-12 col-md-6">
                    <form method="POST">
                        <h1> Invoeren doorkomst </h1>
                    
                        <div class="row">
                            <div class="col-8">
                                <input type="number" class="form-control" id="team_insert" name="team_insert"/>
                            </div>
                            <div class="col-4">
                                <input class=" btn-lg btn-block" type="button" value="CANCEL" onclick="function_cancel()">
                            </div>
                        </div>
                    
                        <hr>
                    
                        <div class="row">
                
                            <div class="col-12">
                                <div class="row">
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="1" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="2" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="3" onclick="function_insertnumber(this.value)">
                                    </div>
                                </div>
                        
                                <br>
                        
                                <div class="row">
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="4" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="5" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="6" onclick="function_insertnumber(this.value)">
                                    </div>
                                </div>
                        
                                <br>
                        
                                <div class="row">
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="7" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="8" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="9" onclick="function_insertnumber(this.value)">
                                    </div>
                                </div>
                        
                                <br>
                        
                                <div class="row">
                                    <div class="col-4">
                    
                                    </div>
                                    <div class="col-4">
                                        <input class=" btn-lg btn-block" type="button" value="0" onclick="function_insertnumber(this.value)">
                                    </div>
                                    <div class="col-4">
                        
                                    </div>
                                </div>
                        
                                <br>
                        
                                <div class="row">
                                    <div class="col-12">
                                        <input class=" btn-lg btn-block" type="submit" value="ENTER">
                                    </div>
                                </div>
                                
                                <br>
                                
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="col-md-6 d-none d-md-block">
                    <h1> Laatste doorkomst </h1>
                    <p> tijd &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ploeg </p>
                    
                    {% for reg in Doorkomst_top10 %}
                        <p>{{ reg.ploeg }}    {{ reg.tijd }} </p>
                    {% endfor %}
                    
                </div>
                
            </div>
        </div>
    </body>
    
<script type = "text/javascript" src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
<script type = "text/javascript" src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>

<script>
    
    function function_cancel() {
        document.getElementById("team_insert").value = "";
        }
    
    function function_insertnumber(number) {
        document.getElementById("team_insert").value = document.getElementById("team_insert").value + number;
        }

</script>
</html>
