<!DOCTYPE html>
<html> 

    <head>
        <meta name = "viewport" content = "width = device-width, initial-scale = 1">     
        <link rel="stylesheet" media="screen" href="{{ url_for('static', filename='bootstrap.min.css') }}">

    </head>
    <body>
        <div class="container-fluid">
            {% include "navbar.html" %}
            
            <h1> Instelingen </h1>
            <form method = "POST">
                <div class"form-group">
                    <label> ID: </label>
                    <label> {{serialid}} </label>
                </div>
            
                <div class"form-group">
                    <label for = "WPP_naam"> Wisselpuntploeg </label>
                    <input type="text" id="WPP_naam" name="WPP_naam" value={{checkpointteam_name}}>
                </div>
            
            
                <div class="form-group">
                    <label for="checkpoint_select"> Wisselpunt </label>
                    <select class="form-control" id="checkpoint_select" name="checkpoint_select">
                        <option disabeld hidden selected> {{ current_checkpoint }}</option>
                        {% for checkpoint in checkpoints %}
                            <option>{{ checkpoint.checkpoint_name }} </option>
                        {% endfor %}
                    
                    </select>
                </div>
                
                <div class="form-group">
                    <input class=" btn-lg btn-block" type="submit" value="ENTER">
                </div>
            </form>
            
        </div>    
    </body>
    
<script type = "text/javascript" src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
<script type = "text/javascript" src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>

</html>
